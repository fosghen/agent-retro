default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: change-limits
        name: branch and 50-line commit limit
        entry: uv run --frozen --no-sync python scripts/check_change_limits.py
        language: system
        always_run: true
        pass_filenames: false
      - id: tests
        name: tests with branch coverage
        entry: uv run --frozen --no-sync pytest
        language: system
        always_run: true
        pass_filenames: false
      - id: security
        name: source and dependency security
        entry: bash -c 'uv run --frozen --no-sync bandit -q -r src scripts && uv run --frozen --no-sync pip-audit'
        language: system
        always_run: true
        pass_filenames: false
