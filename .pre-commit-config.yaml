default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: change-limits
        name: issue branch and logical change limits
        entry: uv run --frozen --no-sync python scripts/check_change_limits.py
        language: system
        always_run: true
        pass_filenames: false
      - id: agent-config
        name: strict Codex agent configuration
        entry: uv run --frozen --no-sync python scripts/check_agent_config.py
        language: system
        always_run: true
        pass_filenames: false
      - id: full-quality-gate
        name: single full publication gate
        entry: uv run --frozen --no-sync python scripts/run_quality_gate.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
