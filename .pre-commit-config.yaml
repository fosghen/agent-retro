default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: change-limits
        name: branch and 50-line commit limit
        entry: uv run --frozen --no-sync python scripts/check_change_limits.py
        language: system
        always_run: true
        pass_filenames: false
      - id: tests
        name: unit tests
        entry: uv run --frozen --no-sync python -m unittest discover -s tests
        language: system
        always_run: true
        pass_filenames: false
