name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Check pull request limits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_change_limits.py --range "$BASE_SHA" "$HEAD_SHA"
      - name: Run tests
        run: |
          uv sync --locked --all-groups
          uv run --frozen --no-sync python scripts/check_agent_config.py
          uv run --frozen --no-sync pytest
          uv run --frozen --no-sync bandit -q -r src scripts
          uv run --frozen --no-sync pip-audit
          uv run --frozen --no-sync agent-retro --help
