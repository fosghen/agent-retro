[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-retro"
version = "0.2.0"
description = "Local-first retrospectives for AI coding agent sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
agent-retro = "agent_retro.cli:main"

[dependency-groups]
dev = [
    "agnix==0.60.3",
    "bandit>=1.8,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "skills-ref",
]

[tool.uv.sources]

[tool.uv.sources.skills-ref]
git = "https://github.com/agentskills/agentskills"
rev = "83021e2be457a9b6679148719c1f6074f0ad975e"
subdirectory = "skills-ref"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_retro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--cov", "--cov-branch", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["agent_retro", "scripts"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",    # Strict mypy is the single owner for typing enforcement.
    "COM812", # Conflicts with the formatter's trailing-comma decisions.
    "CPY001", # The repository license does not require per-file notices.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "PT009",  # The existing test suite intentionally uses unittest assertions.
    "PT027",  # The existing test suite intentionally uses unittest raises.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "S101", # Plain asserts are the native pytest assertion interface.
]
