[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-retro"
version = "0.2.0"
description = "Local-first retrospectives for AI coding agent sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
agent-retro = "agent_retro.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_retro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
